name: Daily Autonomous Update

on:
  schedule:
    - cron: '0 6 * * *' # Runs every day at 6:00 AM UTC
  workflow_dispatch:     # Allows you to manually trigger it anytime from GitHub

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo content
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run automation script
        run: python main.py

      - name: Commit and push changes if site updated
        run: |
          git config --local user.name "Autonomous Bot"
          git config --local user.email "bot@users.noreply.github.com"
          git add index.html
          git commit -m "Automated daily site update" || exit 0
          git push
